[project]
name = "dht-intelligence"
version = "0.1.0"
description = "DHT Network Intelligence Platform — Crawler + AI Agent Analysis"
requires-python = ">=3.11"
dependencies = [
    # Shared
    "pymongo>=4.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    # Crawler
    "bencode.py>=4.0.0",
    # Intelligence - LLM
    "openai>=1.30.0",
    # Intelligence - RAG
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    # Intelligence - Guardrails
    "pydantic>=2.0.0",
    # Intelligence - Enrichment
    "feedparser>=6.0.0",
    # Intelligence - Web UI
    "streamlit>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
